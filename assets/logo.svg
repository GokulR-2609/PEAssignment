<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="500" height="120" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Crest Emblem Group -->
  <g transform="translate(10, 10)">
    <!-- Outer Shield Border -->
    <path d="M50 5 L85 20 C85 65 50 85 50 95 C50 85 15 65 15 20 Z" 
          fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="3" filter="url(#glow)"/>
    
    <!-- Inner Shield Accent -->
    <path d="M50 12 L78 24 C78 60 50 78 50 86 C50 78 22 60 22 24 Z" 
          fill="none" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1.5" stroke-dasharray="3 2"/>

    <!-- University Laurel Leaves Left -->
    <path d="M26 40 C22 45 20 52 24 58 C26 52 28 47 26 40 Z" fill="url(#goldGrad)"/>
    <path d="M29 55 C26 60 25 66 30 71 C31 66 32 61 29 55 Z" fill="url(#goldGrad)"/>
    
    <!-- University Laurel Leaves Right -->
    <path d="M74 40 C78 45 80 52 76 58 C74 52 72 47 74 40 Z" fill="url(#goldGrad)"/>
    <path d="M71 55 C74 60 75 66 70 71 C69 66 68 61 71 55 Z" fill="url(#goldGrad)"/>

    <!-- Open Book Motif in Center -->
    <path d="M35 48 C42 45 47 47 50 50 C53 47 58 45 65 48 V65 C58 62 53 64 50 67 C47 64 42 62 35 65 Z" 
          fill="#FFFFFF" opacity="0.95"/>
    <path d="M50 50 V67" stroke="#1E3A8A" stroke-width="1.5"/>

    <!-- Flame of Knowledge / Torch atop book -->
    <path d="M50 30 C47 35 45 38 48 42 C50 40 52 38 50 35 C52 38 54 41 53 43 C56 39 54 34 50 30 Z" 
          fill="url(#goldGrad)"/>

    <!-- Foundation Star -->
    <polygon points="50,18 52,22 56,22 53,25 54,29 50,26 46,29 47,25 44,22 48,22" fill="url(#goldGrad)"/>
  </g>

  <!-- Typography: Gokul University -->
  <g transform="translate(125, 30)">
    <!-- University Title -->
    <text x="0" y="32" font-family="'Playfair Display', 'Cinzel', 'Georgia', serif" font-size="34" font-weight="800" letter-spacing="1.5" fill="#1E293B" class="brand-text-main">
      GOKUL
    </text>
    <text x="135" y="32" font-family="'Playfair Display', 'Cinzel', 'Georgia', serif" font-size="34" font-weight="700" letter-spacing="2" fill="url(#goldGrad)">
      UNIVERSITY
    </text>

    <!-- Subtitle / Motto -->
    <text x="2" y="54" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" letter-spacing="4" fill="#64748B" class="brand-text-sub">
      EXCELLENCE • INNOVATION • LEADERSHIP
    </text>

    <!-- Accreditation Badge Mini text -->
    <rect x="2" y="64" width="220" height="18" rx="4" fill="rgba(245, 158, 11, 0.15)" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1"/>
    <text x="8" y="77" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" letter-spacing="1" fill="#B45309">
      NAAC A++ ACCREDITED • NIRF TOP 10
    </text>
  </g>
</svg>
